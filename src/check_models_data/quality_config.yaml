# Mechanical output observation thresholds for MLX VLM Check.

thresholds:
  repetition_ratio: 0.9
  min_text_length: 10
  min_token_count: 5
  min_phrase_repetitions: 3
  max_phrase_repetitions: 10
  phrase_coverage_threshold: 0.4
  min_phrase_length: 4
  max_phrase_length: 10
  min_context_term_length: 2
  min_tokens_for_substantial: 10
  min_words_for_filler_response: 15
  min_words_for_truncated: 5
  min_prompt_tokens_for_ratio: 100
  min_output_tokens_for_ratio: 15
  min_output_ratio: 0.02
  long_prompt_tokens_threshold: 3000
  heavy_nontext_prompt_ratio: 0.50
  mixed_prompt_burden_ratio_floor: 0.25
  prompt_title_max_chars: 120
  prompt_description_max_chars: 420
  prompt_keyword_max_items: 20
  prompt_word_to_token_ratio: 1.3
  cutoff_tail_chars: 120
