name: Dependency Sync Guard

on:
  pull_request:
    branches: [main]
    paths:
      - "src/pyproject.toml"
      - "src/README.md"
      - "src/tools/update_readme_deps.py"
      - ".github/workflows/dependency-sync.yml"
  push:
    branches: [main]
    paths:
      - "src/pyproject.toml"
      - "src/README.md"
      - "src/tools/update_readme_deps.py"
      - ".github/workflows/dependency-sync.yml"
  workflow_dispatch: {}

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sync-check:
    name: Verify README dependency blocks are in sync with pyproject
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Prepare Python
        run: |
          python -m pip install --upgrade pip "packaging>=26.0"

      - name: Verify dependency sync
        run: |
          cd src
          python -m tools.update_readme_deps --check
