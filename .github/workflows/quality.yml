name: Quality Checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch: {}

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  skylos-advisory:
    name: Skylos Danger Advisory
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python 3.14
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: "pip"

      - name: Install Skylos
        run: python -m pip install --upgrade pip skylos

      - name: Run Skylos advisory danger scan
        env:
          CI: true
        run: bash src/tools/run_skylos_danger_advisory.sh

  static-quality:
    name: Static Quality Checks (Python ${{ matrix.python-version }})
    runs-on: macos-15
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # The floor (pyproject requires-python) plus the next candidate, so a
        # Python move is continuously rehearsed in CI before the working env
        # follows. tests/test_dependency_sync.py keeps this list honest.
        python-version: ["3.13", "3.14"]
        include:
          # The Python after the working env's (probe_python_next.sh's
          # default). While pip finds no distribution for a requirement (mlx
          # has no cp315 wheel and no sdist yet), the install step warns and
          # skips the checks; any other install failure fails the lane, and
          # once the stack installs, the lane gates like the rest. It is also
          # skipped before NEXT_PYTHON_HOLD_UNTIL (install step).
          - python-version: "3.15"
            next-python: true

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history, as in skylos-advisory: on pull requests Skylos 4.50's
          # `cicd gate` resolves origin/main as its policy base, which a shallow
          # checkout lacks ("Could not resolve PR policy base: origin/main").
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: ${{ matrix.next-python == true }}
          cache: "pip"

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v6
        with:
          node-version: "22"

      - name: Install shellcheck
        run: brew install shellcheck

      - name: Install dependencies
        id: install
        env:
          NEXT_PYTHON: ${{ matrix.next-python == true }}
          # The next-Python lane is held (checks skipped with a warning)
          # before this UTC date; it runs again from that day with no edit.
          # Clear the value to lift the hold early.
          NEXT_PYTHON_HOLD_UNTIL: "2026-11-01"
        # Only the next-Python lane may skip, and only when pip found no
        # distribution at all for some requirement (no wheel and no sdist
        # yet). Any other install failure (a build, resolver or packaging
        # error) fails the lane like every other. Pip also ends with "No
        # matching distribution found" when it could not read the index
        # (connection, certificate, proxy or HTTP errors), so any sign of
        # those fails the lane first.
        run: |
          set -o pipefail
          if [[ "$NEXT_PYTHON" == "true" && "$(date -u +%F)" < "${NEXT_PYTHON_HOLD_UNTIL:-}" ]]; then
            echo "::warning title=Next Python lane on hold::$(python -V) checks are held until ${NEXT_PYTHON_HOLD_UNTIL}."
            echo "available=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          python -m pip install --upgrade pip
          pip_log="${RUNNER_TEMP:-/tmp}/pip-install.log"
          if ! pip install -e "src/.[dev]" 2>&1 | tee "$pip_log"; then
            index_errors='Retrying \(Retry\(|Could not fetch URL|Max retries exceeded|HTTP error [0-9]{3}|SSLError|certificate verify failed|ssl certificate|ProxyError|NewConnectionError|ConnectTimeoutError|ReadTimeoutError|Connection(Error|ResetError| refused| aborted)|Temporary failure in name resolution|Name or service not known|nodename nor servname|Network is unreachable|not a trusted or secure host'
            if [[ "$NEXT_PYTHON" != "true" ]] || grep -Eiq "$index_errors" "$pip_log" || ! grep -q "No matching distribution found for" "$pip_log"; then
              exit 1
            fi
            missing="$(grep -o "No matching distribution found for [^[:space:]]*" "$pip_log" | sed 's/^No matching distribution found for //' | sort -u | paste -sd, -)"
            echo "::warning title=Next Python not installable yet::No distribution for $(python -V) yet: ${missing}. Its static checks are skipped until one is published."
            echo "available=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          npm install --ignore-scripts --no-audit --no-fund --prefix src
          echo "available=true" >> "$GITHUB_OUTPUT"

      - name: Run static quality checks
        if: steps.install.outputs.available == 'true'
        env:
          CI: true
        # Validation tests must not rewrite tracked `src/output/` assets; they
        # write generated artifacts to a temp directory.
        run: bash src/tools/run_quality_checks.sh

      - name: Upload static-quality artifacts on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          if-no-files-found: error
          name: static-quality-artifacts-py${{ matrix.python-version }}
          path: |
            src/output/**
            src/.pytest_cache/**
            src/.coverage*
            src/*.xml
          retention-days: 7

  runtime-smoke:
    name: Runtime Smoke
    runs-on: macos-15
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python 3.14
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e "src/.[dev]"

      - name: Run runtime smoke
        env:
          CI: true
        # Validation tests must not rewrite tracked `src/output/` assets; they
        # write generated artifacts to a temp directory.
        run: bash src/tools/run_runtime_smoke.sh

      - name: Upload runtime-smoke artifacts on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          if-no-files-found: error
          name: runtime-smoke-artifacts
          path: |
            src/output/**
          retention-days: 7
